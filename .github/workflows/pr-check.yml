name: Plugin PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homecraft-plugins
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifests, scope, registry, and CLI tests
        id: validate
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          node tools/validate.mjs --pr-base "$BASE_SHA" --markdown > .local-validate.md || VALIDATE_FAIL=1
          cat .local-validate.md
          cat .local-validate.md >> "$GITHUB_STEP_SUMMARY"
          node tools/registry.mjs --check
          node --test tools/cli.test.mjs
          if [ "${VALIDATE_FAIL:-0}" = "1" ]; then exit 1; fi

      - name: Detect changed plugin
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          PLUGIN_ID=$(git diff --name-only "$BASE_SHA" HEAD | grep -E '^plugins/[^/]+/' | cut -d/ -f2 | sort -u | head -n 1 || true)
          echo "plugin_id=$PLUGIN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout official Homecraft for browser verification
        if: steps.detect.outputs.plugin_id != ''
        uses: actions/checkout@v4
        with:
          repository: terryHu7/homecraft
          path: .local/homecraft

      - name: Install Playwright in Homecraft checkout
        if: steps.detect.outputs.plugin_id != ''
        working-directory: .local/homecraft
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser verification for changed plugin
        if: steps.detect.outputs.plugin_id != ''
        run: |
          PLUGIN_ID="${{ steps.detect.outputs.plugin_id }}"
          if [ -f .local/homecraft/engine/plugins.js ]; then
            node tools/test-plugin.mjs "$PLUGIN_ID" --homecraft .local/homecraft --markdown > .local-browser.md
            cat .local-browser.md
            cat .local-browser.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Upstream terryHu7/homecraft main does not include engine/plugins.js yet; browser test skipped." > .local-browser.md
            cat .local-browser.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification screenshots
        if: always() && steps.detect.outputs.plugin_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: plugin-screenshots-${{ steps.detect.outputs.plugin_id }}
          path: tools/.check/${{ steps.detect.outputs.plugin_id }}/
          if-no-files-found: ignore

      - name: Post review summary comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const parts = ['<!-- homecraft-plugin-check -->'];
            if (fs.existsSync('.local-validate.md')) parts.push(fs.readFileSync('.local-validate.md', 'utf8'));
            if (fs.existsSync('.local-browser.md')) parts.push(fs.readFileSync('.local-browser.md', 'utf8'));
            const body = parts.join('\n\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('<!-- homecraft-plugin-check -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
